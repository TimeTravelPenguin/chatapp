[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Phillip Smith"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TimeTravelPenguin/chatapp"

[workspace.lints.rust]
# missing_docs = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
