[package]
name = "chatapp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
bytes = "1.12.0"
chatapp-db = { path = "../chatapp-db" }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
color-eyre = "0.6.5"
email_address = { version = "0.2.9", features = ["serde"] }
futures-util = "0.3.32"
http = "1.4.2"
iced = "0.14.0"
rolling-file = "0.2.0"
sea-orm = { workspace = true, features = ["schema-sync", "entity-registry"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26.4", features = ["logging"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
  "std",
] }
uuid.workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
